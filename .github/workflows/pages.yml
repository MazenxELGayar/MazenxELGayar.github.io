name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CV build tools
        run: |
          # Microsoft core fonts give the CV its real Arial and Arial Black; Liberation is the fallback.
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer ttf-mscorefonts-installer fonts-liberation
          sudo fc-cache -f
          pip install python-docx
      - name: Build CVs
        # Builds all six variants, publishes every PDF in resume/, and stops the deploy if a
        # one-page CV runs onto a second page, so a broken CV never goes live.
        run: python resume/build_resume.py --strict --publish resume
      - name: Attach CVs to this run
        # Lets you download and check the PDFs from the run page, even when the build fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvs
          path: resume/output/*.pdf
          if-no-files-found: ignore
      - name: Remove CV build files from the site
        run: rm -rf resume/output
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
