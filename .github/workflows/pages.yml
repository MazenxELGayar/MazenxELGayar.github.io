name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Builds the six CVs. If this job fails, the site still deploys (see below) and keeps the
  # CVs that are live now.
  cvs:
    name: Build CVs
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to save the PDFs in resume/pdf/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history, to see whether the CV source changed in this push
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CV build tools
        run: |
          # Microsoft core fonts give the CV its real Arial and Arial Black; Liberation is the fallback.
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer ttf-mscorefonts-installer fonts-liberation
          sudo fc-cache -f
          pip install python-docx
      - name: Build CVs
        # Fails if a one-page CV runs onto a second page, so a broken CV never goes live.
        run: |
          python resume/build_resume.py --strict --publish cv-dist
          cp resume/Mazen-EL-Gayar-CV.pdf cv-dist/
      - name: Hand the CVs to the site deploy
        uses: actions/upload-artifact@v4
        with:
          name: cvs
          path: cv-dist/*.pdf
          if-no-files-found: error
      - name: Save the CVs in the repo (resume/pdf/)
        # Only when the CV source changed (or on a manual run), so site-only pushes add no commits.
        # "[skip ci]" stops this commit from starting another deploy.
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "${{ github.event_name }}" = "push" ] \
            && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null \
            && git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- resume/build_resume.py resume/template.docx; then
            echo "CV source unchanged; nothing to save."
            exit 0
          fi
          mkdir -p resume/pdf
          find cv-dist -name 'Mazen_EL-Gayar_*.pdf' -exec cp {} resume/pdf/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898293+github-actions[bot]@users.noreply.github.com"
          git add resume/pdf
          if git diff --cached --quiet; then echo "No changes to save."; exit 0; fi
          git commit -m "Update CV PDFs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Attach every built CV for checking
        # Downloadable from the run page as "cvs-check", even when the build fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvs-check
          path: resume/output/*.pdf
          if-no-files-found: ignore

  # Deploys the site whether or not the CV job passed.
  deploy:
    name: Deploy site
    needs: cvs
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Add the new CVs
        if: needs.cvs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cvs
          path: resume
      - name: Keep the live CVs (CV build failed)
        # A Pages deploy replaces the whole site, so re-publish the CVs that are live now;
        # otherwise the Download CV buttons would break. Names match FILE_NAMES in build_resume.py.
        if: needs.cvs.result != 'success'
        run: |
          for name in Mazen-EL-Gayar-CV \
            Mazen_EL-Gayar_Software_Engineer_1Page Mazen_EL-Gayar_Software_Engineer_Full \
            Mazen_EL-Gayar_Game_Developer_1Page Mazen_EL-Gayar_Game_Developer_Full \
            Mazen_EL-Gayar_General_1Page Mazen_EL-Gayar_General_International_Full; do
            curl -fsSL -o "resume/$name.pdf" "https://mazenxelgayar.github.io/resume/$name.pdf" \
              || echo "::warning::Could not keep the live $name.pdf"
          done
          echo "::warning::CV build failed; the site was deployed with the CVs that were already live."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
